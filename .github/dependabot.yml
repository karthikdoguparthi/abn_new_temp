version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "karthikdoguparthi"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "fix(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "ci"
      - "security"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
