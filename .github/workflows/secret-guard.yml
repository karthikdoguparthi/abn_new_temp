name: Infrastructure & Secret Leak Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trufflehog-secret-scan:
    name: Deep Git History & Secret Entropy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On pull request: scan commits between base branch and PR head
      - name: TruffleHog Scan (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # On push: scan repository commits with head HEAD (avoiding base=HEAD equality failure)
      - name: TruffleHog Scan (Push to Main)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          head: HEAD
          extra_args: --only-verified

  configuration-audit:
    name: Configuration & Permissive Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit vercel.json & manifest compliance
        run: |
          echo "Verifying vercel.json syntax and structure..."
          node -e "const v = require('./vercel.json'); if (!v.headers) throw new Error('Missing headers');"
          echo "Configuration verified."
