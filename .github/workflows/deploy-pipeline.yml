name: Deploy Staging and Production

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate:
    name: Run Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Test
        run: |
          npm ci
          npm test

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.activebrains.co.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Staging)
        run: |
          echo "Deploying isolated staging build to Vercel preview/staging environment..."
          # Uses VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID configured in GitHub Environment Secrets

  deploy-production:
    name: Deploy to Production Environment
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://activebrains.co.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        run: |
          echo "Deploying validated release to Vercel production..."
          # Deploy step requiring required reviewers via GitHub Protected Environment

