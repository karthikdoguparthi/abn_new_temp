name: SRE Uptime & Synthetic Health Monitoring

on:
  schedule:
    # Runs every 6 hours to verify uptime, SSL validity, and security headers
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Endpoint URL to probe'
        required: false
        default: 'https://activebrains.co.uk'

jobs:
  sre-health-check:
    name: Synthetic Uptime & Security Header Audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Target Availability
        env:
          TARGET: ${{ github.event.inputs.target_url || 'https://activebrains.co.uk' }}
        run: |
          echo "Auditing endpoint: $TARGET"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TARGET" || echo "000")
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Endpoint is healthy and responding."
          else
            echo "::warning title=Uptime Warning::Live target returned status $STATUS (or connection timed out)."
          fi

      - name: Audit HTTP Security Headers
        env:
          TARGET: ${{ github.event.inputs.target_url || 'https://activebrains.co.uk' }}
        run: |
          echo "Inspecting live response security headers..."
          HEADERS=$(curl -s -I --max-time 10 "$TARGET" || true)
          echo "$HEADERS"
          
          # Check for essential defenses
          echo "$HEADERS" | grep -i "x-content-type-options" || echo "::notice::Missing X-Content-Type-Options"
          echo "$HEADERS" | grep -i "x-frame-options" || echo "::notice::Missing X-Frame-Options"
          echo "$HEADERS" | grep -i "strict-transport-security" || echo "::notice::Missing HSTS"
